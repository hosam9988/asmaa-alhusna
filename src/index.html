<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>أسماء الله الحسنى</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="أسماء الله الحسنى: معانيها، وما تدل عليه، وأثرها في القلب، فصلًا فصلًا بقراءة مريحة — The Beautiful Names of Allah explained, chapter by chapter.">
  <meta name="theme-color" content="#f6efe0">
  <!-- Apply the saved colour theme before first paint, so a light theme never flashes black. -->
  <script>
    try {
      var theme = localStorage.getItem('asmaa.theme');
      document.documentElement.dataset.theme = /^(paper|black|white|blue|navy|pink)$/.test(theme) ? theme : 'paper';
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
</head>
<body>

</body>
</html>
